<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactividad con el DOM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>Interactividad con el DOM</h2>
        <p>Haz clic en el botón para incrementar el contador y registrar la hora exacta del evento en la tabla.</p>
        <div id="contador" class="counter-number">0</div>
        <button id="btn-like">¡Haz Clic Aquí!</button>
        <table>
            <thead>
                <tr>
                    <th>Nº Clic</th>
                    <th>Hora</th>
                </tr>
            </thead>
            <tbody id="tabla-body">

            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
